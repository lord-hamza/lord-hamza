<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Muhammad Hamza, AI Engineer and Python Backend Engineer</title>
  <desc id="banner-desc">Banner with the name Muhammad Hamza, the title AI Engineer · Python Backend Engineer, skill chips for LLM systems, RAG and evaluation, agentic AI, computer vision and Python backends, and an abstract network graph in which an API request is routed through a gateway to language models and a vector store before a validated answer comes back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#131C3A"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1210" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="996" cy="160" r="330">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-indigo">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-cyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-green">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.25" fill="#94A3B8"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="320" rx="24"/>
    </clipPath>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="736" y1="0" x2="880" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="incoming" gradientUnits="userSpaceOnUse" x1="712" y1="0" x2="790" y2="0">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <mask id="mesh-fade">
      <rect x="700" width="580" height="320" fill="url(#fade)"/>
    </mask>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .chip rect { fill: #94A3B8; fill-opacity: 0.1; stroke: #94A3B8; stroke-opacity: 0.28; }
      .chip text { fill: #CBD5E1; font-size: 18px; font-weight: 500; text-anchor: middle; }
      .mesh { fill: none; stroke: #94A3B8; stroke-opacity: 0.14; }
      .edge { fill: none; stroke: url(#accent); stroke-width: 2.5; stroke-linecap: round; }
      .standby { stroke-opacity: 0.4; stroke-width: 2; }
      .context { stroke-width: 2; stroke-dasharray: 5 6; stroke-opacity: 0.85; animation: dash 8s linear infinite; }
      .flow { fill: none; stroke: #CFFAFE; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 0.5 39.5; animation: flow 8s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -88; } }
      .node { fill: #0C1228; stroke: url(#accent); stroke-width: 2.25; }
      .glyph { fill: none; stroke: url(#accent); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
      .pulse { animation: pulse 6s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -160; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- card background -->
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)" opacity="0.08"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#94A3B8" stroke-opacity="0.18"/>

  <!-- text column -->
  <g class="sans">
    <text x="62" y="114" font-size="64" font-weight="800" letter-spacing="-1" fill="#F1F5F9">Muhammad Hamza</text>
    <text x="64" y="152" font-size="26" font-weight="500" fill="#CBD5E1">AI Engineer <tspan fill="#818CF8">·</tspan> Python Backend Engineer</text>

    <g class="chip">
      <rect x="64.5" y="180.5" width="148" height="34" rx="17"/>
      <text x="138.5" y="203.5">LLM systems</text>
    </g>
    <g class="chip">
      <rect x="222.5" y="180.5" width="182" height="34" rx="17"/>
      <text x="313.5" y="203.5">RAG &amp; evaluation</text>
    </g>
    <g class="chip">
      <rect x="414.5" y="180.5" width="128" height="34" rx="17"/>
      <text x="478.5" y="203.5">Agentic AI</text>
    </g>
    <g class="chip">
      <rect x="64.5" y="224.5" width="175" height="34" rx="17"/>
      <text x="152" y="247.5">Computer vision</text>
    </g>
    <g class="chip">
      <rect x="249.5" y="224.5" width="172" height="34" rx="17"/>
      <text x="335.5" y="247.5">Python backends</text>
    </g>
  </g>

  <!-- ambient network behind the motif -->
  <!-- satellites sit on dot-grid points; the mask fades the network in from the left -->
  <g mask="url(#mesh-fade)">
    <path class="mesh" d="M708 132L756 108L852 84L996 60L1064 80L1140 60L1192 160L1140 252L1064 240L996 252L852 228L756 204L708 180M756 108L800 160L756 204M800 160L852 84L930 160L852 228Z"/>
    <g fill="#94A3B8" fill-opacity="0.45">
      <circle cx="708" cy="132" r="2.5"/>
      <circle cx="708" cy="180" r="2.5"/>
      <circle cx="756" cy="108" r="2.5"/>
      <circle cx="756" cy="204" r="2.5"/>
      <circle cx="852" cy="84" r="3"/>
      <circle cx="852" cy="228" r="3"/>
      <circle cx="996" cy="60" r="2.5"/>
      <circle cx="996" cy="252" r="2.5"/>
      <circle cx="1140" cy="60" r="3"/>
      <circle cx="1140" cy="252" r="3"/>
    </g>
  </g>

  <!-- motif: API -> gateway -> model (standby model above, vector store below) -> validated answer -->
  <g>
    <circle cx="800" cy="160" r="46" fill="url(#halo-indigo)"/>
    <circle class="pulse" cx="930" cy="160" r="62" fill="url(#halo-indigo)"/>
    <circle cx="1064" cy="160" r="46" fill="url(#halo-cyan)"/>
    <circle cx="1192" cy="160" r="42" fill="url(#halo-green)"/>

    <path class="edge standby" d="M930 160C994 160 1000 80 1064 80C1128 80 1134 160 1192 160"/>
    <path class="edge context" d="M930 160C994 160 1000 240 1064 240V160"/>
    <path d="M712 160H800" stroke="url(#incoming)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M800 160H1192" stroke="url(#accent)" stroke-width="10" stroke-opacity="0.16"/>
    <path class="edge" d="M800 160H1192"/>

    <path class="flow" d="M800 160H1192"/>

    <!-- API -->
    <circle class="node" cx="800" cy="160" r="26"/>
    <path class="glyph" d="M794 149q-4.5 0-4.5 4.5v2.5q0 4-4 4q4 0 4 4v2.5q0 4.5 4.5 4.5M806 149q4.5 0 4.5 4.5v2.5q0 4 4 4q-4 0-4 4v2.5q0 4.5-4.5 4.5"/>

    <!-- gateway / router -->
    <circle cx="930" cy="160" r="45" fill="none" stroke="url(#accent)" stroke-opacity="0.28"/>
    <circle class="node" cx="930" cy="160" r="32"/>
    <path class="glyph" d="M916 160H928C935 160 935 149 942 149M928 160H942M928 160C935 160 935 171 942 171"/>
    <g fill="url(#accent)">
      <circle cx="915" cy="160" r="2.75"/>
      <circle cx="945" cy="149" r="2.75"/>
      <circle cx="945" cy="160" r="2.75"/>
      <circle cx="945" cy="171" r="2.75"/>
    </g>

    <!-- standby model -->
    <circle class="node" cx="1064" cy="80" r="24" stroke-opacity="0.5"/>
    <path fill="url(#accent)" fill-opacity="0.55" d="M1064 69C1065.3 76 1068 78.7 1075 80C1068 81.3 1065.3 84 1064 91C1062.7 84 1060 81.3 1053 80C1060 78.7 1062.7 76 1064 69Z"/>

    <!-- active model -->
    <circle class="node" cx="1064" cy="160" r="24"/>
    <path fill="url(#accent)" d="M1064 149C1065.3 156 1068 158.7 1075 160C1068 161.3 1065.3 164 1064 171C1062.7 164 1060 161.3 1053 160C1060 158.7 1062.7 156 1064 149Z"/>

    <!-- vector store -->
    <circle class="node" cx="1064" cy="240" r="24"/>
    <g class="glyph" stroke-width="2">
      <ellipse cx="1064" cy="232" rx="10" ry="3.75"/>
      <path d="M1054 232V248A10 3.75 0 0 0 1074 248V232M1054 240A10 3.75 0 0 0 1074 240"/>
    </g>

    <!-- validated answer -->
    <circle cx="1192" cy="160" r="20" fill="#0C1228" stroke="#34D399" stroke-width="2.25"/>
    <path d="M1183.5 160.5L1189 166L1200 154" fill="none" stroke="#34D399" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
